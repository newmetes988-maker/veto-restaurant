services:
  - type: web
    name: veto-api
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: veto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin1234

databases:
  - name: veto-db
    databaseName: veto_restaurant
    user: veto_user
    plan: free
